services:
  db:
    image: postgres:18-alpine
    container_name: lumify-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumify}
      POSTGRES_DB: ${POSTGRES_DB:-lumify}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lumify_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumify_pg:
