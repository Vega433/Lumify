services:
  db:
    image: postgres:16-alpine
    container_name: lumify-db
    environment:
      POSTGRES_USER: lumify
      POSTGRES_PASSWORD: lumify
      POSTGRES_DB: lumify
    ports:
      # 5433 снаружи — если локальный Postgres уже занял 5432
      - "5433:5432"
    volumes:
      - lumify_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumify -d lumify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumify_pg:
